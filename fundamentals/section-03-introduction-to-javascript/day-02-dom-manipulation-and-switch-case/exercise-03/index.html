<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Math Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Simple Math Calculator</h1>
    <p>
      Enter two numbers, one in each field, and choose a valid operator (+, -,
      /, or *).
    </p>

    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">
    <input type="text" id="operator" placeholder="Operator (+, -, /, *)">
<button onclick="performOperation()">Calculate</button>
    <p id="result"></p>
  </body>
</html>
