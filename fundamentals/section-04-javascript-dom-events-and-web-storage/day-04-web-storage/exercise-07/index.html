<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Clothing Store</h1>
    <p class="subtitle">Choose your favorite pieces and save your cart in the browser.</p>
  </header>

  <main>
    <section class="products-section">
      <h2>Products</h2>

      <div class="products-container">
        <article class="card">
          <h3>T-Shirt</h3>
          <p class="price">$20</p>
          <p class="description">A comfortable cotton t-shirt for everyday wear.</p>
          <button class="add-btn">T-Shirt</button>
        </article>

        <article class="card">
          <h3>Jeans</h3>
          <p class="price">$50</p>
          <p class="description">Classic blue jeans that match any outfit.</p>
          <button class="add-btn">Jeans</button>
        </article>

        <article class="card">
          <h3>Jacket</h3>
          <p class="price">$80</p>
          <p class="description">A stylish jacket for cold days.</p>
          <button class="add-btn">Jacket</button>
        </article>
      </div>
    </section>

    <section class="cart-section">
      <h2>Shopping Cart</h2>
      <p class="cart-info">Items added will appear below:</p>
      <ul id="cart-list"></ul>

      <button id="clear-cart">Clear cart</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
