<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorite Animals</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1 id="page-title">Favorite Animals</h1>
    </header>

    <main>
      <h3 id="subtitle">My top 3 favorite animals</h3>

      <ul class="cards-container">
        <li class="card selected" id="first-card">Cats are very cute.</li>
        <li class="card" id="second-card">Dogs are very loyal.</li>
        <li class="card" id="third-card">Dolphins are very smart.</li>
      </ul>

      <input
        type="text"
        id="text-input"
        placeholder="Change the selected card text"
      />

      <script src="script.js"></script>
    </main>
  </body>
</html>
