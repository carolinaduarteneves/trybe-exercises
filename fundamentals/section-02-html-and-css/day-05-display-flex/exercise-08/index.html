<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codeflix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header-container">
        <img src="images/logo.png"
            alt="Minimalist black and white logo for ‘Codeflix’, featuring a play button icon with coding symbols and modern sans-serif typography, outlined in white on a transparent background."
            class="header-img">

        <h1 class="header-title">From Syntax to Screen</h1>

        <a href="" target="_blank" class="header-login">SIGN-UP</a>
    </header>

    <section class="text-section">
        <p>Take a look at some of the exclusive movie posters on CodeFlix — where programming languages become cinematic
            universes and every line of code tells a story!</p>
    </section>

    <section class="gallery">
        <div class="gallery-card">
            <h4>HTML</h4>
            <img src="images/html.png"
                alt="Movie-style poster of HTML5 featuring the iconic red HTML5 shield logo with the number 5, set against a dark futuristic city background">
        </div>

        <div class="gallery-card">
            <h4>CSS</h4>
            <img src="images/css.png"
                alt="Movie-style poster of CSS3 featuring the blue CSS3 shield logo, a character standing in a colorful neon city">
        </div>

        <div class="gallery-card">
            <h4>JAVASCRIPT</h4>
            <img src="images/javascript.png"
                alt="Movie-style poster of JavaScript featuring the yellow JS shield logo set in a vibrant neon digital cityscape">
        </div>

        <div class="gallery-card">
            <h4>REACT</h4>
            <img src="images/react.png"
                alt="Movie-style poster of React featuring the blue React atom logo glowing over a futuristic city skyline">
        </div>

        <div class="gallery-card">
            <h4>RTL</h4>
            <img src="images/rtl.png"
                alt="Dark movie-style poster of RTL featuring a giant red octopus emerging from the ocean with dramatic lighting">
        </div>

        <div class="gallery-card">
            <h4>REDUX</h4>
            <img src="images/redux.png"
                alt="Dark and moody movie-style poster of Redux featuring the purple Redux logo and a hooded figure in a foggy environment">
        </div>

    </section>

    <footer class="footer-container">

        <img src="images/codeflix_mobile_final.png"
            alt="Codeflix Mobile logo with bold white outlined black text on a transparent background" class="codeflix">



        <img src="images/codeflix_web_final.png"
            alt="Codeflix Web logo with bold white outlined black text on a transparent background" class="codeflix">

    </footer>
</body>

</html>
